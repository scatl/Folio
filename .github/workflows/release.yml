name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  docker:
    name: Build Docker tar
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Free disk space
        run: |
          # Docker job only — safe to drop the preinstalled Android SDK here.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and export Docker image
        env:
          FOLIO_TAG: ${{ steps.ver.outputs.version }}
        run: |
          docker compose build
          mkdir -p .build
          docker save "folio:${FOLIO_TAG}" -o ".build/folio-${FOLIO_TAG}.tar"

      - name: Upload Docker tar artifact
        uses: actions/upload-artifact@v4
        with:
          name: folio-docker-tar
          path: .build/folio-${{ steps.ver.outputs.version }}.tar
          if-no-files-found: error

  android:
    name: Build signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Android signing
        working-directory: Folio-Client
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_STORE_PASSWORD" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Missing Android signing secrets" >&2
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > keystore-release.jks
          {
            echo "storePassword=$ANDROID_STORE_PASSWORD"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "storeFile=../../keystore-release.jks"
          } > android/key.properties

      - name: Flutter pub get
        working-directory: Folio-Client
        run: flutter pub get

      - name: Build signed release APK
        working-directory: Folio-Client
        run: flutter build apk --release

      - name: Name APK with version
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          SRC=$(ls Folio-Client/build/app/outputs/flutter-apk/*.apk | head -n1)
          cp "$SRC" "Folio-Client/build/app/outputs/flutter-apk/folio-${VERSION}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: folio-apk
          path: Folio-Client/build/app/outputs/flutter-apk/folio-${{ steps.ver.outputs.version }}.apk
          if-no-files-found: error

  upload:
    name: Attach assets to Release
    needs: [docker, android]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
