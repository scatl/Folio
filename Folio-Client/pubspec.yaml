name: folio
description: "Folio Android client."
publish_to: 'none'

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  cookie_jar: ^4.0.9
  dio_cookie_manager: ^3.5.0
  path_provider: ^2.1.6
  path: ^1.9.1
  shared_preferences: ^2.5.6
  cached_network_image: ^4.0.4
  flutter_riverpod: 3.4.2
  go_router: 18.1.4
  flutter_svg: ^2.2.1
  url_launcher: ^6.3.2
  easy_refresh: ^4.0.0
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  file_picker: ^13.1.0
  gbk_codec: ^0.4.0
  screen_brightness: ^2.1.11
  volume_controller: ^3.7.1
  battery_plus: ^7.1.2
  material_ui: ^1.11.0
  cupertino_ui: ^1.1.6

dependency_overrides:
  # 2.5.0 的 getAll 是 suspend，release 下 JNI 找不到这个方法，启动会停在黑屏。
  shared_preferences_android: 2.4.28
  # 默认 default jar 不含 TrueHD；与 SMBTool 一样改用 full 版 libmpv。
  media_kit_libs_android_video:
    path: packages/media_kit_libs_android_video

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/providers/
    - assets/fonts/DroidSansFallback.ttf
    - assets/folio_mark.svg
